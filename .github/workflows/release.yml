name: Release

# The only path that publishes images. Every push to main builds the image
# once and pushes two tags to GHCR:
#   * ghcr.io/bedasrv/asrsub:<full-40-char-git-sha>  — immutable, authoritative
#   * ghcr.io/bedasrv/asrsub:latest                  — convenience alias for
#     the newest main build (so public pulls get the current Rust image)
# Production deploys must still pin the immutable SHA: docker-compose.yml
# requires an explicit ${ASRSUB_IMAGE} and never falls back to `latest`.
# NOTE: the image name is hardcoded lowercase — github.repository would
# expand to bedasrv/ASRSub, which GHCR rejects (must be lowercase).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bedasrv/asrsub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard full-SHA tag
        run: echo "${{ github.sha }}" | grep -qE '^[0-9a-f]{40}$'
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bedasrv/asrsub:${{ github.sha }}
            ghcr.io/bedasrv/asrsub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Emit non-secret release descriptor
        run: |
          cat > release.json <<EOF
          {
            "asrsub_image": "ghcr.io/bedasrv/asrsub:${{ github.sha }}",
            "git_sha": "${{ github.sha }}",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: release.json
