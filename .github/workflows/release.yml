name: Release

# The only path that publishes images. Every push to main builds one
# immutable image tagged with the full 40-char git SHA and pushes it to
# GHCR. No mutable `latest` tag exists by design (see docs/DEPLOY.md).
# NOTE: the image name is hardcoded lowercase — github.repository would
# expand to bedasrv/ASRSub, which GHCR rejects (must be lowercase).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bedasrv/asrsub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard full-SHA tag
        run: echo "${{ github.sha }}" | grep -qE '^[0-9a-f]{40}$'
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bedasrv/asrsub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Emit non-secret release descriptor
        run: |
          cat > release.json <<EOF
          {
            "asrsub_image": "ghcr.io/bedasrv/asrsub:${{ github.sha }}",
            "git_sha": "${{ github.sha }}",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.json
