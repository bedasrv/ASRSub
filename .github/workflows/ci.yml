name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6d7f3d3f6d7f3d3f6d7f3d3f6d7f3d3f6d7f3d3f
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: bash -n build.sh
      - run: bash -n scripts/deploy_smoke.sh
      - run: ASRSUB_IMAGE=ghcr.io/bedasrv/asrsub:ci docker compose config -q

  docker:
    # Verifies the image builds (toolchain/lockfile/MSRV drift) without
    # publishing — release.yml is the only push path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@988b5a0280414fde2c9b6f1f4c9f5f9cf9f3f0f1
      - uses: docker/build-push-action@1a9f1f1f3d7f5d4d87d5f9f5cbf4b5d4f5d4f5d4
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
