name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 -m py_compile tools/*.py tests/test_*.py
      - run: bash -n build.sh
      - run: bash -n tools/build_signer_supervisors.sh
      - run: bash -n scripts/asrsub-health-probe scripts/deploy_smoke.sh
      - run: python3 tools/check_file_budgets.py --repo-root . --manifest tests/fixtures/platform/file-budgets.json
      - run: ASRSUB_IMAGE=ghcr.io/bedasrv/asrsub:ci docker compose config -q

  docker:
    # Verifies the image builds (toolchain/lockfile/MSRV drift) without
    # publishing — release.yml is the only push path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
