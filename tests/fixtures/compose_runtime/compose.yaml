services:
  orchestrator:
    image: ghcr.io/bedasrv/asrsub@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/lib/asrsub/runtime-secrets/discord_webhook:/run/secrets/discord_webhook:ro
secrets:
  discord_webhook:
    file: /var/lib/asrsub/runtime-secrets/discord_webhook
