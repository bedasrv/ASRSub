name: asrsub

# Defaults preserve local development. Set ASRSUB_IMAGE and ASRSUB_VERSION to
# deploy a pinned image from GHCR, for example:
# ASRSUB_IMAGE=ghcr.io/bedasrv/asrsub ASRSUB_VERSION=1.2.3 docker compose up -d
x-asrsub-image: &asrsub-image "${ASRSUB_IMAGE:-asrsub}:${ASRSUB_VERSION:-latest}"

services:
  orchestrator:
    build:
      context: .
    image: *asrsub-image
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Jakarta
    network_mode: host
    volumes:
      - /home/user/.config/asr-pipeline:/home/user/.config/asr-pipeline
      - /home/user/.cache/asr-pipeline:/home/user/.cache/asr-pipeline
      - /home/user/.cache/huggingface:/home/user/.cache/huggingface
      - /mnt/nas/share/media:/mnt/nas/share/media
    restart: unless-stopped
    command: [python, orchestrator.py]

  dashboard:
    image: *asrsub-image
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Jakarta
    volumes:
      - /home/user/.config/asr-pipeline:/home/user/.config/asr-pipeline
      - /mnt/nas/share/media:/mnt/nas/share/media
    restart: unless-stopped
    command: [python, dashboard.py]
