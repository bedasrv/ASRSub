name: asrsub

services:
  orchestrator:
    image: ${ASRSUB_IMAGE:?ASRSUB_IMAGE must be an immutable digest}
    user: "1000:1000"
    cap_add: []
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cgroup: host
    network_mode: host
    environment:
      TZ: Asia/Jakarta
      CONTROL_API_KEY_FILE: /run/secrets/control_api_key
      NAS_MEDIA_PREFIX: /mnt/nas/share/media
      WEBHOOK_PORT: "8085"
      EGRESS_POLICY_FILE: /run/asrsub/egress-policy.json
    # STATE_FILE is fixed inside the image at /var/lib/asrsub/state/state.jsonl.
    # Host-side readiness probe: http://127.0.0.1:${WEBHOOK_PORT:-8085}/ready
    env_file:
      - path: ${PROVIDER_KEYS_FILE:-/home/user/.config/asr-pipeline/secrets/provider_keys.env}
        required: false
    volumes:
      - type: bind
        source: /var/lib/asrsub/config
        target: /home/user/.config/asr-pipeline
        read_only: false
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /var/lib/asrsub/cache
        target: /home/user/.cache/asr-pipeline
        read_only: false
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /var/lib/asrsub/state
        target: /var/lib/asrsub/state
        read_only: false
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /mnt/nas/share/media
        target: /mnt/nas/share/media
        read_only: false
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /mnt/nas/share/media
        target: /media
        read_only: true
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /var/lib/asrsub/runtime-secrets/discord_webhook
        target: /run/secrets/discord_webhook
        read_only: true
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /var/lib/asrsub/runtime-secrets/control_key
        target: /run/secrets/control_api_key
        read_only: true
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /sys/fs/cgroup/system.slice/asrsub-runtime.service/asrsub-children
        target: /run/asrsub/children-cgroup
        read_only: false
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /usr/local/libexec/asrsub/asrsub
        target: /usr/local/bin/asrsub
        read_only: true
        bind: { propagation: rprivate, create_host_path: false }
      - type: bind
        source: /var/lib/asrsub/egress-policy/egress-policy.json
        target: /run/asrsub/egress-policy.json
        read_only: true
        bind: { propagation: rprivate, create_host_path: false }
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:${WEBHOOK_PORT:-8085}/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

secrets:
  # CONTROL_API_KEY_FILE_HOST is an operator-only staging input; the
  # interpolation-free rendered candidate contains the fixed staged target.
  discord_webhook:
    file: /var/lib/asrsub/runtime-secrets/discord_webhook
  control_api_key:
    file: /var/lib/asrsub/runtime-secrets/control_key
