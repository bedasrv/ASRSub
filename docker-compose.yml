name: asrsub

services:
  orchestrator:
    build:
      context: .
    image: asrsub:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Jakarta
      - ASR_BACKEND=sensevoice
      - EMO_ENABLED=1
      - CONTROL_API_KEY=68624da8cf4015c6210ebb18a2d88e224a32365323bdbbca
    network_mode: host
    volumes:
      - /home/user/.config/asr-pipeline:/home/user/.config/asr-pipeline
      - /home/user/.cache/asr-pipeline:/home/user/.cache/asr-pipeline
      - /home/user/.cache/huggingface:/home/user/.cache/huggingface
      - /mnt/nas/share/media:/mnt/nas/share/media
    restart: unless-stopped
    command: [python, orchestrator.py]

  dashboard:
    image: asrsub:latest
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Jakarta
    volumes:
      - /home/user/.config/asr-pipeline:/home/user/.config/asr-pipeline
      - /mnt/nas/share/media:/mnt/nas/share/media
    restart: unless-stopped
    command: [python, dashboard.py]
