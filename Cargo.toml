[package]
name = "asrsub"
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
description = "ASRSub remote-API subtitle pipeline: wanted list -> remote Whisper ASR -> remote LLM translate -> Bazarr upload"
license = "MIT"

[[bin]]
name = "asrsub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.8", features = ["json"] }
futures = "0.3"
fd-lock = "4"
maud = "0.27"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
