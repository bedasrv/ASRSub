<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASRSub</title>
<style>
:root {
  --bg:#fff; --fg:#111; --card:#f5f5f5; --border:#ddd; --accent:#2563eb;
  --ok:#16a34a; --err:#dc2626; --run:#d97706; --new:#64748b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1115; --fg:#e5e7eb; --card:#1a1d24; --border:#2a2e37; --accent:#3b82f6;
  }
}
html[data-theme="light"] {
  --bg:#fff; --fg:#111; --card:#f5f5f5; --border:#ddd; --accent:#2563eb;
  --ok:#16a34a; --err:#dc2626; --run:#d97706; --new:#64748b;
}
html[data-theme="dark"] {
  --bg:#0f1115; --fg:#e5e7eb; --card:#1a1d24; --border:#2a2e37; --accent:#3b82f6;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--fg); font-size: 15px;
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 10;
}
header h1 { font-size: 18px; margin: 0; }
.header-right { display: flex; align-items: center; gap: 10px; }
#refresh-ind { font-size: 12px; color: var(--new); }
#theme-toggle {
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer;
}
main { padding: 10px; max-width: 820px; margin: 0 auto; }
#error-banner {
  display: none; background: var(--err); color: #fff; padding: 10px 14px;
  border-radius: 8px; margin-bottom: 12px; font-size: 14px;
}
#error-banner.visible { display: block; }
.summary {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px;
}
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; text-align: center;
}
.stat .num { font-size: 22px; font-weight: 700; }
.stat .lbl { font-size: 12px; color: var(--new); margin-top: 2px; }
.stat.wanted .num { color: var(--accent); }
.stat.done .num { color: var(--ok); }
.stat.error .num { color: var(--err); }
.stat.running .num { color: var(--run); }
.pills { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.pill {
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; display: flex; align-items: center; gap: 6px;
}
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.up { background: var(--ok); }
.dot.down { background: var(--err); }
.dot.running { background: var(--run); }
.dot.stopped { background: var(--new); }
h2 { font-size: 15px; margin: 14px 0 6px; }
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.chev { transition: transform .15s; font-size: 12px; color: var(--new); }
.sec.collapsed .sec-body { display: none; }
.sec.collapsed .chev { transform: rotate(-90deg); }
#wanted-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px;
}
.ep-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ep-series { font-weight: 700; font-size: 15px; }
.ep-code { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.ep-title { font-size: 13px; color: var(--new); margin: 4px 0; }
.ep-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.missing { font-size: 12px; color: var(--new); }
.badge {
  border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; color: #fff;
}
.badge.new { background: var(--new); }
.badge.done { background: var(--ok); }
.badge.error { background: var(--err); }
.badge.running { background: var(--run); }
.elapsed { font-size: 12px; color: var(--new); }
#recent-list { display: grid; grid-template-columns: 1fr; gap: 6px; }
.recent {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 13px;
}
.recent .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.recent .ep-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .right { display: flex; align-items: center; gap: 10px; color: var(--new); font-size: 12px; white-space: nowrap; }
.muted { color: var(--new); }
footer { text-align: center; color: var(--new); font-size: 12px; padding: 18px 0 30px; }

#ctl-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
#ctl-actions button {
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
}
#ctl-actions button:disabled { opacity: 0.45; cursor: not-allowed; }
#ctl-actions button#act-pause { border-color: var(--err); color: var(--err); }
#ctl-actions button#act-resume { border-color: var(--ok); color: var(--ok); }
.ctl-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px;
}
.ctl-stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.ctl-stat .lbl { font-size: 11px; color: var(--new); }
.ctl-stat .val { font-size: 14px; font-weight: 600; }
.ctl-stat .val.ok { color: var(--ok); }
.ctl-stat .val.err { color: var(--err); }
.ctl-stat .val.run { color: var(--run); }
#ctl-config table { width: 100%; border-collapse: collapse; font-size: 13px; }
#ctl-config th, #ctl-config td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
#ctl-config th { color: var(--new); font-size: 12px; font-weight: 600; }
#ctl-config td .kv { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
#ctl-config .mini {
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
}
#ctl-config .mini.unset { border-color: var(--err); color: var(--err); }
#ctl-config input[type="text"] {
  background: var(--card); border: 1px solid var(--border); color: var(--fg);
  border-radius: 6px; padding: 4px 6px; font-size: 12px; width: 200px;
}
#ctl-msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
#ctl-msg.ok { color: var(--ok); }
#ctl-msg.err { color: var(--err); }
@media (min-width: 768px) {
  .ctl-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 768px) {
  body { font-size: 16px; }
  main { padding: 20px; }
  .summary { grid-template-columns: repeat(4, 1fr); }
  #wanted-list { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<header>
  <h1>ASRSub</h1>
  <div class="header-right">
    <span id="refresh-ind"></span>
    <button id="theme-toggle" title="Theme">🔄</button>
  </div>
</header>
<main>
  <div id="error-banner">dashboard backend unreachable</div>
  <div class="summary">
    <div class="stat wanted"><div class="num" id="s-wanted">–</div><div class="lbl">Wanted</div></div>
    <div class="stat done"><div class="num" id="s-done">–</div><div class="lbl">Done</div></div>
    <div class="stat error"><div class="num" id="s-error">–</div><div class="lbl">Error</div></div>
    <div class="stat running"><div class="num" id="s-running">–</div><div class="lbl">Running</div></div>
  </div>
  <div class="pills">
    <span class="pill"><span class="dot stopped" id="p-dot"></span><span id="p-text">pipeline …</span></span>
    <span class="pill"><span class="dot stopped" id="a-dot"></span><span id="a-text">asr …</span></span>
  </div>
  <section class="sec" id="sec-wanted">
    <h2 class="sec-head" data-sec="wanted">Wanted <span class="chev">▾</span></h2>
    <div class="sec-body"><div id="wanted-list"></div></div>
  </section>
  <section class="sec" id="sec-recent">
    <h2 class="sec-head" data-sec="recent">Recent activity <span class="chev">▾</span></h2>
    <div class="sec-body"><div id="recent-list"></div></div>
  </section>
  <section class="sec" id="sec-control">
    <h2 class="sec-head" data-sec="control">Control <span class="chev">▾</span></h2>
    <div class="sec-body">
      <div id="ctl-status"><div class="muted">loading…</div></div>
      <div id="ctl-actions">
        <button id="act-wake" onclick="ctlAction('wake')">Wake now</button>
        <button id="act-run-once" onclick="ctlAction('run-once')">Run once</button>
        <button id="act-pause" onclick="ctlAction('pause')">Pause</button>
        <button id="act-resume" onclick="ctlAction('resume')">Resume</button>
      </div>
      <div id="ctl-config"><div class="muted">loading…</div></div>
      <div id="ctl-msg"></div>
    </div>
  </section>
  <footer>polls every 15s · read-only</footer>
</main>
<script>
const LS_THEME = "asr-dash-theme";
const ICONS = { auto: "🔄", light: "☀️", dark: "🌙" };

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme-toggle").textContent = ICONS[t] || ICONS.auto;
}
function initTheme() {
  let t = localStorage.getItem(LS_THEME);
  if (!t || !ICONS[t]) t = "auto";
  applyTheme(t);
  return t;
}
let theme = initTheme();
document.getElementById("theme-toggle").addEventListener("click", function () {
  const order = ["auto", "light", "dark"];
  const idx = order.indexOf(theme);
  theme = order[(idx + 1) % order.length];
  localStorage.setItem(LS_THEME, theme);
  applyTheme(theme);
});

const LS_SECTIONS = "asr-dash-sections";
const DEF_SECTIONS = { wanted: true, recent: true, control: false };
function initSections() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(LS_SECTIONS) || "{}") || {}; } catch (e) { s = {}; }
  const merged = Object.assign({}, DEF_SECTIONS, s);
  for (const sec of document.querySelectorAll(".sec")) {
    const name = sec.querySelector(".sec-head").dataset.sec;
    const collapsed = merged[name] === false;
    sec.classList.toggle("collapsed", collapsed);
  }
  document.querySelectorAll(".sec-head").forEach(function (h) {
    h.addEventListener("click", function () {
      const sec = h.parentElement;
      const name = h.dataset.sec;
      const collapsed = !sec.classList.contains("collapsed");
      sec.classList.toggle("collapsed", collapsed);
      const cur = {};
      try { Object.assign(cur, JSON.parse(localStorage.getItem(LS_SECTIONS) || "{}")); } catch (e) {}
      cur[name] = !collapsed;
      localStorage.setItem(LS_SECTIONS, JSON.stringify(cur));
    });
  });
}
initSections();

function relTime(ts) {
  if (!ts) return "";
  const d = new Date(ts.replace("Z", "+00:00"));
  if (isNaN(d.getTime())) return ts;
  const diff = Date.now() - d.getTime();
  if (diff < 0) return "now";
  const m = Math.floor(diff / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}
function fmtElapsed(s) {
  if (s == null) return "";
  return s + "s";
}
function statusClass(st) {
  if (st === "done") return "done";
  if (st === "error") return "error";
  if (st === "running") return "running";
  return "new";
}
function pillDot(el, up) {
  el.className = "dot " + (up ? "up" : "down");
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

let lastData = null;
let fetchFail = false;

function render(data) {
  lastData = data;
  document.getElementById("s-wanted").textContent = data.wanted_total ?? "–";
  document.getElementById("s-done").textContent = data.state_summary.done ?? "–";
  document.getElementById("s-error").textContent = data.state_summary.error ?? "–";
  document.getElementById("s-running").textContent = data.state_summary.running ?? "–";

  const pipe = data.pipeline || {};
  const pd = document.getElementById("p-dot");
  const pt = document.getElementById("p-text");
  if (pipe.running) {
    pd.className = "dot running";
    pt.textContent = "pipeline running (pid " + (pipe.pid || "?") + ")";
  } else {
    pd.className = "dot stopped";
    pt.textContent = "pipeline stopped";
  }
  const ad = document.getElementById("a-dot");
  const at = document.getElementById("a-text");
  if (data.asr && data.asr.up) {
    ad.className = "dot up";
    at.textContent = "asr up (" + (data.asr.latency_ms != null ? data.asr.latency_ms + "ms" : "?") + ")";
  } else {
    ad.className = "dot down";
    at.textContent = "asr down";
  }

  const wl = document.getElementById("wanted-list");
  wl.innerHTML = "";
  const wanted = data.wanted || [];
  if (!wanted.length) {
    wl.innerHTML = '<div class="muted">no wanted episodes</div>';
  } else {
    for (const ep of wanted) {
      const badge = '<span class="badge ' + statusClass(ep.state_status) + '">' + esc(ep.state_status) + "</span>";
      const elapsed = ep.state_status === "done" && ep.elapsed_s != null
        ? '<span class="elapsed">' + fmtElapsed(ep.elapsed_s) + "</span>" : "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="ep-head"><span class="ep-series">' + esc(ep.series) + '</span><span class="ep-code">' + esc(ep.episode) + "</span></div>" +
        '<div class="ep-title">' + esc(ep.title) + "</div>" +
        '<div class="ep-meta"><span class="missing">missing: ' + (ep.missing && ep.missing.length ? esc(ep.missing.join(", ")) : "none") + "</span>" +
        "<span>" + badge + elapsed + "</span></div>";
      wl.appendChild(card);
    }
  }

  const rl = document.getElementById("recent-list");
  rl.innerHTML = "";
  const recent = data.recent || [];
  if (!recent.length) {
    rl.innerHTML = '<div class="muted">no recent activity</div>';
  } else {
    for (const r of recent) {
      const el = document.createElement("div");
      el.className = "recent";
      el.innerHTML =
        '<div class="left"><span class="dot ' + (r.status === "error" ? "down" : "up") + '"></span>' +
        '<span class="ep-label">' + esc(r.label) + "</span></div>" +
        '<div class="right">' +
        (r.elapsed_s != null ? "<span>" + fmtElapsed(r.elapsed_s) + "</span>" : "") +
        "<span>" + relTime(r.ts) + "</span></div>";
      rl.appendChild(el);
    }
  }

  document.getElementById("refresh-ind").textContent = "updated " + relTime(data.updated_at);
}

async function poll() {
  const banner = document.getElementById("error-banner");
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    fetchFail = false;
    banner.classList.remove("visible");
    render(data);
  } catch (e) {
    fetchFail = true;
    banner.classList.add("visible");
  }
}

function ctlMsg(text, kind) {
  const m = document.getElementById("ctl-msg");
  m.textContent = text || "";
  m.className = kind || "";
}

async function ctlFetch(url, opts) {
  const res = await fetch(url, Object.assign({ cache: "no-store" }, opts || {}));
  let data = null;
  try { data = await res.json(); } catch (e) { data = { raw: "" }; }
  return { status: res.status, data: data };
}

async function loadControlStatus() {
  const el = document.getElementById("ctl-status");
  const pa = document.getElementById("act-pause");
  const re = document.getElementById("act-resume");
  try {
    const { status, data } = await ctlFetch("/api/control/status");
    if (status !== 200) {
      el.innerHTML = '<div class="muted">control API unreachable (' + esc(data.error || status) + ")</div>";
      pa.disabled = true; re.disabled = true;
      return;
    }
    const lp = data.last_pass || {};
    const sc = data.state_counts || {};
    const paused = !!data.paused;
    const rows = [
      ["daemon state", paused ? '<span class="val run">paused</span>' : '<span class="val ok">running</span>'],
      ["uptime", '<span class="val">' + esc(data.uptime_s != null ? data.uptime_s + "s" : "?") + "</span>"],
      ["run-once requested", '<span class="val">' + (data.run_once_requested ? "yes" : "no") + "</span>"],
      ["consecutive failures", '<span class="val">' + esc(data.consecutive_failures ?? "?") + "</span>"],
      ["last pass processed", '<span class="val">' + esc(lp.processed ?? "?") + "</span>"],
      ["last pass done/skipped/failed", '<span class="val">' + esc((lp.done ?? "?") + "/" + (lp.skipped ?? "?") + "/" + (lp.failed ?? "?")) + "</span>"],
      ["last pass wanted before/after", '<span class="val">' + esc((lp.wanted_before ?? "?") + "/" + (lp.wanted_after ?? "?")) + "</span>"],
      ["state counts done", '<span class="val ok">' + esc(sc.done ?? "?") + "</span>"],
      ["state counts error", '<span class="val err">' + esc(sc.error ?? "?") + "</span>"],
      ["state counts pending", '<span class="val">' + esc(sc.pending ?? "?") + "</span>"],
      ["state counts total", '<span class="val">' + esc(sc.total ?? "?") + "</span>"],
      ["started at", '<span class="val">' + esc(data.started_at || "?") + "</span>"],
    ];
    el.innerHTML = '<div class="ctl-grid">' + rows.map(function (r) {
      return '<div class="ctl-stat"><div class="lbl">' + r[0] + '</div><div class="val">' + r[1] + "</div></div>";
    }).join("") + "</div>";
    pa.disabled = paused;
    re.disabled = !paused;
  } catch (e) {
    el.innerHTML = '<div class="muted">control API unreachable (' + esc(e.message) + ")</div>";
    pa.disabled = true; re.disabled = true;
  }
}

const DEFAULT_KEYS = ["MAX_EPS_PER_RUN", "TARGET_LANGS", "TRANSLATE_BASE", "TRANSLATE_MODEL", "MAX_TRANSLATE_WORKERS"];

function ctlRow(key, value) {
  const secret = value === "***";
  const input = secret
    ? '<input type="text" data-key="' + esc(key) + '" placeholder="secret, re-enter to change">'
    : '<input type="text" data-key="' + esc(key) + '" value="' + esc(value) + '">';
  return '<tr><td class="kv">' + esc(key) + '</td><td>' + input + '</td>' +
    '<td><button class="mini" onclick="setConfigKey(\'' + esc(key).replace(/'/g, "\\'") + '\')">Set</button> ' +
    '<button class="mini unset" onclick="unsetConfigKey(\'' + esc(key).replace(/'/g, "\\'") + '\')">Unset</button></td></tr>';
}

async function loadControlConfig() {
  const el = document.getElementById("ctl-config");
  try {
    const { status, data } = await ctlFetch("/api/control/config");
    if (status !== 200) {
      el.innerHTML = '<div class="muted">control API unreachable (' + esc(data.error || status) + ")</div>";
      return;
    }
    const keys = DEFAULT_KEYS.concat(Object.keys(data).sort()).filter(function (k, i, a) {
      return a.indexOf(k) === i;
    });
    let html = '<table><tr><th>Key</th><th>Value</th><th></th></tr>';
    for (const k of keys) {
      html += ctlRow(k, data[k] != null ? data[k] : "");
    }
    html += '<tr><td><input type="text" id="ctl-new-key" placeholder="KEY" style="width:160px"></td>' +
      '<td><input type="text" id="ctl-new-val" placeholder="VALUE" style="width:200px"></td>' +
      '<td><button class="mini" onclick="addKey()">Add</button></td></tr></table>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<div class="muted">control API unreachable (' + esc(e.message) + ")</div>";
  }
}

function addKey() {
  const k = document.getElementById("ctl-new-key").value.trim();
  const v = document.getElementById("ctl-new-val").value;
  if (!k) { ctlMsg("key required", "err"); return; }
  setConfigKey(k, v);
}

async function setConfigKey(key, value) {
  const input = document.querySelector('#ctl-config input[data-key="' + CSS.escape(key) + '"]');
  const val = (value !== undefined && value !== null) ? value : (input ? input.value : "");
  if (val === "***") {
    ctlMsg("secret keys are masked; re-enter the actual value to change", "err");
    return;
  }
  const body = {}; body[key] = val;
  try {
    const { status, data } = await ctlFetch("/api/control/config", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (status === 200) {
      ctlMsg("applied " + key + "=" + val, "ok");
      loadControlConfig();
    } else {
      ctlMsg("set failed: " + esc(data.error || status), "err");
    }
  } catch (e) {
    ctlMsg("set failed: " + esc(e.message), "err");
  }
}

async function unsetConfigKey(key) {
  const body = {}; body[key] = null;
  try {
    const { status, data } = await ctlFetch("/api/control/config", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (status === 200) {
      ctlMsg("unset " + key, "ok");
      loadControlConfig();
    } else {
      ctlMsg("unset failed: " + esc(data.error || status), "err");
    }
  } catch (e) {
    ctlMsg("unset failed: " + esc(e.message), "err");
  }
}

async function ctlAction(a) {
  ctlMsg("sending " + a + "…");
  try {
    const { status, data } = await ctlFetch("/api/control/action", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: a }),
    });
    if (status === 200) {
      ctlMsg(a + " ok: " + JSON.stringify(data));
      loadControlStatus();
    } else {
      ctlMsg(a + " failed: " + esc(data.error || status), "err");
    }
  } catch (e) {
    ctlMsg(a + " failed: " + esc(e.message), "err");
  }
}

poll();
setInterval(poll, 15000);
loadControlStatus();
loadControlConfig();
setInterval(loadControlStatus, 15000);
</script>
</body>
</html>
